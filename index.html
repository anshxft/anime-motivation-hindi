<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔥 Anime Motivation — Hindi</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: #111118; --accent: #ff4d00;
      --accent2: #ff9900; --text: #f0ede8; --muted: #6b6870; --border: #1e1e2a;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.4; }
    .blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; }
    .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
    header { text-align: center; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 8vw, 64px); letter-spacing: 4px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .tagline { font-size: 13px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
    .card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; position: relative; overflow: hidden; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .quote-mark { font-family: 'Bebas Neue', sans-serif; font-size: 80px; color: var(--accent); opacity: 0.15; line-height: 0.6; margin-bottom: 16px; display: block; }
    .quote-text { font-family: 'Tiro Devanagari Hindi', serif; font-size: clamp(18px, 4vw, 24px); line-height: 1.7; color: var(--text); margin-bottom: 28px; }
    .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .character { font-size: 13px; font-weight: 600; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; }
    .divider { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
    .anime-name { font-size: 13px; color: var(--muted); }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
    .tag { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border); color: var(--muted); }
    .counter { font-size: 12px; color: var(--muted); text-align: center; letter-spacing: 1px; }
    .counter span { color: var(--accent); font-weight: 600; }
    .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; padding: 16px 40px; border-radius: 100px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 0 30px rgba(255, 77, 0, 0.3); }
    .btn:hover { transform: scale(1.04); box-shadow: 0 0 50px rgba(255, 77, 0, 0.5); }
    .btn:active { transform: scale(0.97); }
    footer { font-size: 12px; color: var(--muted); text-align: center; letter-spacing: 1px; }
    footer a { color: var(--accent); text-decoration: none; }
    .loading { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 4px; color: var(--muted); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="container">
    <header>
      <div class="logo">🔥 Anime Motivation</div>
      <div class="tagline">Hindi Quotes Collection</div>
    </header>
    <div class="card" id="card">
      <div class="loading">LOADING...</div>
    </div>
    <div class="counter" id="counter"></div>
    <button class="btn" onclick="showRandom()">NEXT QUOTE ⚡</button>
    <footer>
      Open source on <a href="https://github.com/anshxft/anime-motivation-hindi" target="_blank">GitHub</a> · Free JSON API
    </footer>
  </div>
  <script>
    const CDN = 'https://cdn.jsdelivr.net/gh/anshxft/anime-motivation-hindi/quotes.json';
    let quotes = [], shown = [];
    async function loadQuotes() {
      try {
        const res = await fetch(CDN);
        quotes = await res.json();
        showRandom();
      } catch {
        quotes = [
          { id:1, anime:"Naruto", character:"Naruto Uzumaki", quote:"Agar tu apne sapno se nahi ladega, toh unka kya matlab?", tags:["struggle","dreams"] },
          { id:2, anime:"Attack on Titan", character:"Eren Yeager", quote:"Agar tu aage nahi badha, toh jeet nahi sakta.", tags:["courage","action"] },
          { id:3, anime:"One Piece", character:"Monkey D. Luffy", quote:"Meri zindagi mein koi regret nahi hogi.", tags:["dreams","freedom"] },
          { id:4, anime:"Dragon Ball Z", character:"Vegeta", quote:"Koi bhi apni taaqat ki seema nahi jaanta jab tak woh haar nahi maanta.", tags:["strength","willpower"] },
          { id:5, anime:"Demon Slayer", character:"Tanjiro Kamado", quote:"Chahe kitni bhi mushkil ho, main apne aap ko nahi toda.", tags:["persistence","family"] }
        ];
        showRandom();
      }
    }
    function showRandom() {
      if (shown.length === quotes.length) shown = [];
      const remaining = quotes.filter(q => !shown.includes(q.id));
      const q = remaining[Math.floor(Math.random() * remaining.length)];
      shown.push(q.id);
      const card = document.getElementById('card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeIn 0.5s ease';
      card.innerHTML = `
        <span class="quote-mark">"</span>
        <p class="quote-text">${q.quote}</p>
        <div class="meta">
          <span class="character">${q.character}</span>
          <div class="divider"></div>
          <span class="anime-name">${q.anime}</span>
        </div>
        <div class="tags">${q.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      `;
      document.getElementById('counter').innerHTML = `Quote <span>${shown.length}</span> of <span>${quotes.length}</span>`;
    }
    loadQuotes();
  </script>
</body>
</html>
